<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="470" viewBox="0 0 1160 470" role="img" aria-labelledby="title description">
  <title id="title">Hand-drawn software pipeline for attention tiles</title>
  <desc id="description">A loose hand-drawn timeline. Light blue boxes load tiles, dark blue boxes multiply tiles, and orange boxes compute softmax. At step three, the three rows work on tiles two, one, and zero at the same time.</desc>
  <defs>
    <g id="load-box">
      <path d="M 5 4 Q 38 1 68 4 L 127 2 Q 132 4 131 10 L 129 53 Q 127 59 120 58 L 7 60 Q 2 57 4 51 L 2 11 Q 2 6 5 4 Z" fill="#cdeafa" stroke="#1e4e83" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M 8 7 Q 58 5 124 6 M 128 14 Q 127 34 126 50 M 13 57 Q 65 55 116 56" fill="none" stroke="#1e4e83" stroke-width="1.1" stroke-linecap="round" opacity="0.42"/>
    </g>
    <g id="multiply-box">
      <path d="M 4 5 Q 39 2 72 4 L 126 3 Q 132 4 130 11 L 132 51 Q 130 58 122 57 L 8 60 Q 2 57 3 52 L 2 12 Q 2 7 4 5 Z" fill="#1e4e83" stroke="#1e4e83" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M 9 4 Q 71 0 124 5 M 130 15 L 129 48 M 8 58 Q 65 61 120 57" fill="none" stroke="#1e4e83" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>
    </g>
    <g id="softmax-box">
      <path d="M 6 3 Q 54 1 94 3 L 126 5 Q 131 7 130 13 L 129 53 Q 127 59 120 58 L 6 59 Q 2 56 3 51 L 4 10 Q 4 5 6 3 Z" fill="#f5ad58" stroke="#1e4e83" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M 12 6 Q 64 4 120 8 M 128 16 Q 130 35 125 50 M 10 56 Q 61 58 116 55" fill="none" stroke="#1e4e83" stroke-width="1.1" stroke-linecap="round" opacity="0.48"/>
    </g>
  </defs>

  <rect width="1160" height="470" fill="#ffffff"/>
  <g font-family="Marker Felt, Noteworthy, Bradley Hand, Comic Sans MS, cursive" fill="#1e4e83">
    <text x="42" y="55" font-size="31">three tiles in flight</text>
    <text x="45" y="85" font-size="18">one kernel keeps loading, multiplying, and softmax busy</text>
    <text x="1030" y="116" font-size="18">time</text>
    <text x="43" y="177" font-size="24">load</text>
    <text x="43" y="201" font-size="17">TMA</text>
    <text x="43" y="273" font-size="24">matrix multiply</text>
    <text x="43" y="297" font-size="17">Tensor Cores</text>
    <text x="43" y="368" font-size="24">softmax</text>
    <text x="43" y="392" font-size="17">CUDA cores</text>
    <text x="282" y="447" font-size="18">step 3: load tile 2 while tile 1 multiplies and tile 0 runs softmax</text>
  </g>

  <path d="M 43 63 Q 161 67 278 62" fill="none" stroke="#1e4e83" stroke-width="1.6" stroke-linecap="round" opacity="0.62"/>
  <path d="M 282 109 Q 467 107 641 111 Q 847 108 1015 110" fill="none" stroke="#1e4e83" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 1005 103 Q 1015 109 1005 116" fill="none" stroke="#1e4e83" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Marker Felt, Noteworthy, Bradley Hand, Comic Sans MS, cursive" font-size="18" fill="#1e4e83" text-anchor="middle">
    <text x="350" y="137" transform="rotate(-4 350 137)">1</text>
    <text x="506" y="136" transform="rotate(3 506 136)">2</text>
    <text x="662" y="138" transform="rotate(-3 662 138)">3</text>
    <text x="818" y="135" transform="rotate(4 818 135)">4</text>
    <text x="974" y="137" transform="rotate(-2 974 137)">5</text>
  </g>

  <g transform="translate(284 150) rotate(-1.6 66 30)">
    <use href="#load-box"/>
    <text x="66" y="39" text-anchor="middle" fill="#1e4e83" font-family="Marker Felt, Noteworthy, Bradley Hand, Comic Sans MS, cursive" font-size="21">tile 0</text>
  </g>
  <g transform="translate(440 150) rotate(1.2 66 30)">
    <use href="#load-box"/>
    <text x="66" y="39" text-anchor="middle" fill="#1e4e83" font-family="Marker Felt, Noteworthy, Bradley Hand, Comic Sans MS, cursive" font-size="21">tile 1</text>
  </g>
  <g transform="translate(596 150) rotate(-0.8 66 30)">
    <use href="#load-box"/>
    <text x="66" y="39" text-anchor="middle" fill="#1e4e83" font-family="Marker Felt, Noteworthy, Bradley Hand, Comic Sans MS, cursive" font-size="21">tile 2</text>
  </g>
  <g transform="translate(752 150) rotate(1.7 66 30)">
    <use href="#load-box"/>
    <text x="66" y="39" text-anchor="middle" fill="#1e4e83" font-family="Marker Felt, Noteworthy, Bradley Hand, Comic Sans MS, cursive" font-size="21">tile 3</text>
  </g>

  <g transform="translate(440 245) rotate(1.3 66 30)">
    <use href="#multiply-box"/>
    <text x="66" y="39" text-anchor="middle" fill="#ffffff" font-family="Marker Felt, Noteworthy, Bradley Hand, Comic Sans MS, cursive" font-size="21">tile 0</text>
  </g>
  <g transform="translate(596 245) rotate(-1.4 66 30)">
    <use href="#multiply-box"/>
    <text x="66" y="39" text-anchor="middle" fill="#ffffff" font-family="Marker Felt, Noteworthy, Bradley Hand, Comic Sans MS, cursive" font-size="21">tile 1</text>
  </g>
  <g transform="translate(752 245) rotate(0.9 66 30)">
    <use href="#multiply-box"/>
    <text x="66" y="39" text-anchor="middle" fill="#ffffff" font-family="Marker Felt, Noteworthy, Bradley Hand, Comic Sans MS, cursive" font-size="21">tile 2</text>
  </g>
  <g transform="translate(908 245) rotate(-1.2 66 30)">
    <use href="#multiply-box"/>
    <text x="66" y="39" text-anchor="middle" fill="#ffffff" font-family="Marker Felt, Noteworthy, Bradley Hand, Comic Sans MS, cursive" font-size="21">tile 3</text>
  </g>

  <g transform="translate(596 340) rotate(1.1 66 30)">
    <use href="#softmax-box"/>
    <text x="66" y="39" text-anchor="middle" fill="#1e4e83" font-family="Marker Felt, Noteworthy, Bradley Hand, Comic Sans MS, cursive" font-size="21">tile 0</text>
  </g>
  <g transform="translate(752 340) rotate(-1.5 66 30)">
    <use href="#softmax-box"/>
    <text x="66" y="39" text-anchor="middle" fill="#1e4e83" font-family="Marker Felt, Noteworthy, Bradley Hand, Comic Sans MS, cursive" font-size="21">tile 1</text>
  </g>
  <g transform="translate(908 340) rotate(1.4 66 30)">
    <use href="#softmax-box"/>
    <text x="66" y="39" text-anchor="middle" fill="#1e4e83" font-family="Marker Felt, Noteworthy, Bradley Hand, Comic Sans MS, cursive" font-size="21">tile 2</text>
  </g>
</svg>
